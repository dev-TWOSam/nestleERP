<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nestle ERP Product Search</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://res.cloudinary.com/xbezzyxi/image/upload/v1790303103/WhatsApp_Image_2026-09-24_at_6.19.18_PM.jpg" alt="Nestle ERP Logo">
        </div>
        <nav>
            <a href="./index.html">Home</a>
            <a href="pages/products.html">Products</a>
        </nav>
    </header>
    
    <main>
        <section class="hero">
            <h2>Find Your Favourite Nestle Products</h2>
            <p>Search for Nestle products by name or product ID</p>
            <!-- Search -->
            <div class="search-section">
                <div class="search-box">
                    <input type="search" id="searchInput" placeholder="Search for a products by name or ID" aria-label="Search products">
                    <button type="button" id="searchButton">Search</button>
                </div>
                <!-- Filter -->
                <div class="filter-controls">
                    <div class="filter-field">
                        <label for="categoryFilter">Category</label>
                        <input type="text" id="categoryFilter" placeholder="e.g. Beverages">
                    </div>
                    <div class="filter-field">
                        <label for="minPrice">Minimum Price</label>
                        <input type="number" id="minPrice" placeholder="Min price" min="0">
                    </div>
                    <div class="filter-field">
                        <label for="maxPrice">Maximum Price</label>
                        <input type="number" id="maxPrice" placeholder="Max price" min="0">
                    </div>
                    <div class="filter-field">
                        <label for="sortSelect">Sort By</label>
                        <select id="sortSelect">
                            <option value="">Sort products</option>
                            <option value="price-asc">Price: Low to High</option>
                            <option value="price-desc">Price: High to Low</option>
                            <option value="name-asc">Name: A - Z</option>
                            <option value="name-desc">Name: Z - A</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <section class="products-section">
            <h2 id="productsHeading">Featured Products</h2>
            <div class="products-grid" id="productContainer">
                <!-- Products will be loaded from the backend -->
                
            </div>
            <div class="pagination" id="pagination">
                <button id="previousPage" type="button">Previous</button>
                <span id="pageInfo"></span>
                <button id="nextPage" type="button">Next</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Nestle ERP Product Search</p>
    </footer>
    <script type="module" src="js/home.js"></script>

</body>
</html>
