<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nestle ERP Product Search</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://res.cloudinary.com/xbezzyxi/image/upload/v1790303103/WhatsApp_Image_2026-09-24_at_6.19.18_PM.jpg" alt="Nestle ERP Logo">
        </div>
        <nav>
            <a href="./index.html">Home</a>
            <a href="pages/products.html">Products</a>
        </nav>
    </header>
    
    <main>
        <section class="hero">
            <h2>Find Your Favourite Nestle Products</h2>
            <p>Search for Nestle products by name or category</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search for a product ...">
                <button id="searchButton">Search</button>
            </div>
        </section>

        <section class="products-section">
            <h2>Featured Products</h2>
            <div class="featured-container" id="productContainer">
                <!-- Products will be loaded from the backend -->
                
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Nestle ERP Product Search</p>
    </footer>
    <script type="module" src="js/home.js"></script>

</body>
</html>
