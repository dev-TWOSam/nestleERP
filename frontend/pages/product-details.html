<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Nestle ERP</title>
    <link rel="stylesheet" href="../css/product-details.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://res.cloudinary.com/xbezzyxi/image/upload/v1790303103/WhatsApp_Image_2026-09-24_at_6.19.18_PM.jpg" alt="Nestle ERP Logo">
        </div>
        <nav>
            <a href="../index.html">Home</a>
            <a href="products.html">Products</a>
        </nav>
    </header>
    <main>
        <section class="product-details">
            <div class="product-image">
                <img src="" alt="" id="productImage">
            </div>
            <div class="product-info">
                <h1 id="productName"></h1>
                <p id="productCategory"></p>
                <p id="productDescription"></p>
                <p id="productSize"></p>
                <p id="productPrice"></p>
                <p id="productStatus"></p>
                 <a href="../index.html" id="backButton">Back to Products</a>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Nestle ERP Product Search</p>
    </footer>
    <script type="module" src="../js/product-details.js"></script>
</body>
</html>
