<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products | Nestlé Nigeria ERP</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/products.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html">Nestlé Nigeria ERP</a>
    <nav class="site-nav" aria-label="Main">
      <a href="../index.html">Home</a>
      <a href="products.html" aria-current="page">Products</a>
      <a href="admin-login.html">Admin</a>
    </nav>
  </header>

  <main class="catalog">
    <div class="catalog-head">
      <h1>Products</h1>
      <p id="resultsSummary" class="results-summary" aria-live="polite">Loading products…</p>
    </div>

    <section class="toolbar" aria-label="Search and sort">
      <div class="field field-search">
        <label for="searchInput">Search products</label>
        <input
          id="searchInput"
          type="search"
          placeholder="Search by product name or ID"
          autocomplete="off"
        />
      </div>

      <div class="field">
        <label for="sortSelect">Sort by</label>
        <select id="sortSelect">
          <option value="newest">Newest first</option>
          <option value="name-asc">Name: A to Z</option>
          <option value="name-desc">Name: Z to A</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </div>

      <div class="field">
        <label for="pageSizeSelect">Per page</label>
        <select id="pageSizeSelect">
          <option value="8">8</option>
          <option value="12" selected>12</option>
          <option value="24">24</option>
          <option value="48">48</option>
        </select>
      </div>

      <button id="filtersToggle" class="btn btn-ghost filters-toggle" type="button" aria-expanded="false" aria-controls="filtersPanel">
        Filters
      </button>
    </section>

    <div class="layout">
      <aside id="filtersPanel" class="filters" aria-label="Filters">
        <div class="filters-head">
          <h2>Filters</h2>
          <button id="clearFilters" class="link-btn" type="button">Clear all</button>
        </div>

        <div class="filter-group">
          <label for="categorySelect">Category</label>

          <select id="categorySelect">
            <option value="">All categories</option>
          </select>
        </div>

        <fieldset class="filter-group">
          <legend>Price (₦)</legend>
          <div class="price-row">
            <input id="minPrice" type="number" min="0" inputmode="numeric" placeholder="Min" aria-label="Minimum price" />
            <span aria-hidden="true">to</span>
            <input id="maxPrice" type="number" min="0" inputmode="numeric" placeholder="Max" aria-label="Maximum price" />
          </div>
        </fieldset>

        <fieldset class="filter-group">
          <legend>Availability</legend>
          <label class="check">
            <input id="inStockOnly" type="checkbox" />
            <span>In stock only</span>
          </label>
        </fieldset>
      </aside>

      <section class="results" aria-label="Product results">
        <div id="activeFilters" class="chips" aria-label="Active filters"></div>
        <div id="productGrid" class="grid" aria-busy="true"></div>
        <div id="statusBox" class="status" hidden></div>
        <nav id="pagination" class="pagination" aria-label="Pagination"></nav>
      </section>
    </div>
  </main>

  <script type="module" src="../js/products.js"></script>
</body>
</html>
