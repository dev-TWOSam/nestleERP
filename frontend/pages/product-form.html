<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Form | nestleERP</title>

    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/product-form.css" />
  </head>

  <body>
    <main class="page-section">
      <div class="container">
        <header class="product-form__header">
          <div>
            <p class="product-form__eyebrow">Inventory</p>

            <h1 id="form-title">Add Product</h1>

            <p class="product-form__description">
              Create a new product for the inventory.
            </p>
          </div>

          <a class="button button--secondary" href="./admin-products.html">
            Back to Products
          </a>
        </header>

        <div id="page-message" class="page-message" role="alert" hidden></div>

        <form id="product-form" class="product-form" novalidate>
          <div class="product-form__grid">
            <div class="form-field">
              <label class="form-label" for="name"> Product Name </label>

              <input id="name" name="name" type="text" required />

              <p class="form-error" id="name-error" hidden></p>
            </div>

            <div class="form-field">
              <label class="form-label" for="category"> Category </label>

              <input id="category" name="category" type="text" required />

              <p class="form-error" id="category-error" hidden></p>
            </div>

            <div class="form-field product-form__full-width">
              <label class="form-label" for="description"> Description </label>

              <textarea id="description" name="description" required></textarea>

              <p class="form-error" id="description-error" hidden></p>
            </div>

            <div class="form-field">
              <label class="form-label" for="price"> Price </label>

              <input
                id="price"
                name="price"
                type="number"
                min="0"
                step="0.01"
                required
              />
            </div>

            <div class="form-field">
              <label class="form-label" for="size"> Size </label>

              <input id="size" name="size" type="text" required />
            </div>

            <div class="form-field">
              <label class="form-label" for="quantity"> Quantity </label>

              <input
                id="quantity"
                name="quantity"
                type="number"
                min="0"
                step="1"
                required
              />
            </div>

            <div class="form-field">
              <label class="form-label" for="color"> Color </label>

              <input id="color" name="color" type="text" required />
            </div>

            <div class="form-field">
              <label class="form-label" for="status"> Status </label>

              <select id="status" name="status">
                <option value="In Stock">In Stock</option>
                <option value="Inactive">Inactive</option>
                <option value="Out of Stock">Out of Stock</option>
              </select>
            </div>

            <div class="form-field product-form__full-width">
              <label class="form-label" for="image"> Product Image </label>

              <input
                id="image"
                name="image"
                type="file"
                accept="image/*"
                required
              />

              <p class="form-help">Upload an image for the product.</p>
            </div>
          </div>

          <div id="image-preview" class="product-form__preview" hidden>
            <p class="form-label">Image Preview</p>

            <img id="preview-image" src="" alt="Product preview" />
          </div>

          <div class="product-form__actions">
            <a class="button button--secondary" href="./admin-products.html">
              Cancel
            </a>

            <button class="button" id="submit-button" type="submit">
              Save Product
            </button>
          </div>
        </form>
      </div>
    </main>

    <script type="module" src="../js/product-form.js"></script>
  </body>
</html>
